<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
  --bg: #0b1220;
  --card: #111a2e;
  --card-soft: #16213e;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #38bdf8;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: 'Inter', Arial, sans-serif;
  background:linear-gradient(180deg,#050b18,#0b1220);
  color:var(--text);
  overflow:hidden;
}

.container{
  padding:24px;
  max-width:1300px;
  margin:auto;
}

.cards-resumo{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:22px;
}

.resumo{
  background:linear-gradient(180deg,var(--card),var(--card-soft));
  border-radius:18px;
  padding:20px;
  box-shadow:0 15px 35px rgba(0,0,0,.4);
  position:relative;
}

.resumo span{
  font-size:13px;
  color:var(--muted);
}

.resumo h2{
  margin:8px 0 4px;
  font-size:28px;
  font-weight:700;
}

.compare{
  font-size:13px;
  font-weight:600;
}

.compare.positivo{color:var(--green)}
.compare.negativo{color:var(--red)}

.area-principal{
  display:grid;
  grid-template-columns:2.2fr 1fr;
  gap:22px;
  height:calc(100vh - 260px);
}

.grafico-box,
.historico-box{
  background:linear-gradient(180deg,var(--card),var(--card-soft));
  border-radius:20px;
  padding:20px;
  box-shadow:0 15px 35px rgba(0,0,0,.4);
  height: 62%;
  max-height: 90%
}

.cards-vendas{
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height: 90%
}

.venda-card{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:14px;
}

.venda-card h3{
  margin:0 0 6px;
  font-size:14px;
}

.venda-card p{
  margin:2px 0;
  font-size:12px;
  color:var(--muted);
}

.valor{
  margin-top:6px;
  font-size:16px;
  font-weight:700;
  color:var(--green);
}

.exportar{
  text-align:right;
  margin-bottom:10px;
}

button{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  border:none;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

button:hover{opacity:.9}

.loading{
  position:fixed;
  inset:0;
  background:rgba(5,11,24,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,.1);
  border-top:4px solid var(--blue);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.btn-pdf{
  background:#0ea5e9;
  color:#fff;
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.cards-hoje{
  display:flex;
  justify-content:center;
  gap:28px;
  margin-bottom:22px;
}

.hoje-card{
  min-width:200px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px 16px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.hoje-card span{
  font-size:12px;
  color:var(--muted);
}

.hoje-card h3{
  margin:6px 0 0;
  font-size:20px;
  font-weight:700;
}

.hoje-card.lucro-positivo h3{ color:var(--green) }
.hoje-card.lucro-negativo h3{ color:var(--red) }



@media print{
  body *{
    visibility:hidden;
  }
  #relatorioPDF, #relatorioPDF *{
    visibility:visible;
  }
  #relatorioPDF{
    position:absolute;
    left:0;
    top:0;
    width:100%;
  }
}


</style>
</head>

<body>

<div class="container">


  <!-- RESUMO -->
    <div class="cards-resumo">
    <div class="resumo">
      <span>Faturamento do mês</span>
      <h2 id="totalMes">R$ 0,00</h2>
      <div class="compare" id="compareFaturamento"></div>
    </div>

    <div class="resumo">
      <span>Pedidos</span>
      <h2 id="totalPedidos">0</h2>
    </div>

    <div class="resumo">
      <span>Ticket médio</span>
      <h2 id="ticketMedio">R$ 0,00</h2>
    </div>

    <div class="resumo">
      <span>Lucro do mês</span>
      <h2 id="lucroMes">R$ 0,00</h2>
      <div class="compare" id="compareLucro"></div>
    </div>
  </div>

<div class="cards-hoje">
  <div class="hoje-card">
    <span>Faturamento hoje</span>
    <h3 id="totalHoje">R$ 0,00</h3>
  </div>

  <div class="hoje-card">
    <span>Pedidos hoje</span>
    <h3 id="pedidosHoje">0</h3>
  </div>

  <div class="hoje-card">
    <span>Lucro hoje</span>
    <h3 id="lucroHoje">R$ 0,00</h3>
  </div>
</div>



  <!-- ÁREA PRINCIPAL -->
  <div class="area-principal">

    <div class="grafico-box">
      <canvas id="graficoVendas"></canvas>
    </div>

    <div class="historico-box">
      <div class="exportar">
        <button onclick="exportarPDF()" class="btn-pdf">
           Exportar Relatório do Mês (PDF)
        </button>
      </div>
      <div class="cards-vendas" id="listaVendas"></div>
    </div>

  </div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Carregando dados...</p>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwYgAW9WlamF3c9YYK4LAy7SYWgnQsDS4PWgDwp_iPDbVy_BdalCVy3G_jseog1sxrd/exec";

let grafico;
let dadosGlobais = [];

function parseValor(v){
  return Number(String(v).replace("R$","").replace(",",".")) || 0;
}

function setComparacao(id, valor){
  const el = document.getElementById(id);
  if(!el) return;

  if(valor > 0){
    el.textContent = `▲ ${valor.toFixed(1)}%`;
    el.className = "compare positivo";
  }else if(valor < 0){
    el.textContent = `▼ ${Math.abs(valor).toFixed(1)}%`;
    el.className = "compare negativo";
  }else{
    el.textContent = "";
  }
}

function extrairDataBR(dataStr){
  // dataStr = "dd/MM/yyyy"
  const [dia, mes, ano] = dataStr.split("/").map(Number);
  return { dia, mes, ano };
}


function formatarHora(valor) {
  if (!valor) return "";

  // Caso venha como Date
  if (String(valor).includes("T")) {
    const d = new Date(valor);
    return d.toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  // Caso venha como número do Sheets (fração do dia)
  if (!isNaN(valor)) {
    const totalMin = Math.round(valor * 24 * 60);
    const h = String(Math.floor(totalMin / 60)).padStart(2, "0");
    const m = String(totalMin % 60).padStart(2, "0");
    return `${h}:${m}`;
  }

  return valor;
}

function normalizarDataBR(valor) {
  if (!valor) return "";

  // Já está em dd/MM/yyyy
  if (typeof valor === "string" && valor.includes("/")) {
    return valor;
  }

  // ISO / Date
  const d = new Date(valor);
  if (isNaN(d)) return "";

  const dia = String(d.getDate()).padStart(2, "0");
  const mes = String(d.getMonth() + 1).padStart(2, "0");
  const ano = d.getFullYear();

  return `${dia}/${mes}/${ano}`;
}

function carregarDashboard(){
  fetch(`${API}?tipo=registros`)
    .then(r => r.json())
    .then(dados => {
      dadosGlobais = dados;

      const hoje = new Date();
      const mes = hoje.getMonth();
      const ano = hoje.getFullYear();

      let totalMes=0, pedidosMes=0, lucroMes=0;
      let totalMesAnt=0, lucroMesAnt=0;
      let vendasPorDia = {};

      let totalHoje = 0;
      let pedidosHoje = 0;
      let lucroHoje = 0;

      const hojeBR = new Date().toLocaleDateString("pt-BR");


      const lista = document.getElementById("listaVendas");
      lista.innerHTML = "";

      dados.reverse().forEach(v => {

        const dataBR = normalizarDataBR(v.data);
        v.data = dataBR; // 🔥 padroniza tudo

        const { dia, mes: mesVenda, ano: anoVenda } = extrairDataBR(dataBR);

        const valor = parseValor(v.total);
        const custo = parseValor(v.custo);
	
        if (v.data === hojeBR) {
         totalHoje += valor;
         lucroHoje += (valor - custo);
         pedidosHoje++;
        }


        if (mesVenda - 1 === mes && anoVenda === ano) {
          totalMes += valor;
          lucroMes += (valor - custo);
          pedidosMes++;

          const d = dia;
	  vendasPorDia[d] = (vendasPorDia[d] || 0) + valor;

        }

        if (mesVenda - 1 === mes - 1 && anoVenda === ano) {
 	  totalMesAnt += valor;
  	  lucroMesAnt += (valor - custo);
	}


        lista.innerHTML += `
          <div class="venda-card">
            <h3>Pedido #${v.pedido}</h3>
            <p>📅 ${v.data} • ⏰ ${formatarHora(v.hora)}</p>
            <div class="valor">R$ ${valor.toFixed(2)}</div>
          </div>`;
      });

	document.getElementById("totalHoje").innerText =
 	 totalHoje.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

	document.getElementById("pedidosHoje").innerText = pedidosHoje;

	document.getElementById("lucroHoje").innerText =
  	 lucroHoje.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

const cardLucro = document.getElementById("lucroHoje").parentElement;

cardLucro.classList.remove("lucro-positivo", "lucro-negativo");

if (lucroHoje > 0) {
  cardLucro.classList.add("lucro-positivo");
} else if (lucroHoje < 0) {
  cardLucro.classList.add("lucro-negativo");
}

      document.getElementById("totalMes").innerText =
        totalMes.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

      document.getElementById("lucroMes").innerText =
        lucroMes.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

      document.getElementById("totalPedidos").innerText = pedidosMes;
      document.getElementById("ticketMedio").innerText =
        pedidosMes ? (totalMes/pedidosMes).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) : "R$ 0,00";

      const percentualFaturamento =
        totalMesAnt ? ((totalMes - totalMesAnt) / totalMesAnt) * 100 : 0;

      const percentualLucro =
        lucroMesAnt ? ((lucroMes - lucroMesAnt) / lucroMesAnt) * 100 : 0;

      setComparacao("compareFaturamento", percentualFaturamento);
      setComparacao("compareLucro", percentualLucro);


      montarGrafico(vendasPorDia);
    })
    .finally(()=>document.getElementById("loading").style.display="none");
}

function montarGrafico(v){
  const dias = Object.keys(v);
  const valores = Object.values(v);
  if(grafico) grafico.destroy();

  grafico = new Chart(document.getElementById("graficoVendas"),{
    type:"line",
    data:{labels:dias,datasets:[{data:valores,fill:true,tension:.4}]},
    options:{plugins:{legend:{display:false}}}
  });
}

function exportarCSV(){
  let csv = "Pedido,Data,Hora,Valor,Custo,Lucro\n";
  dadosGlobais.forEach(v=>{
    const valor=parseValor(v.total);
    const custo=parseValor(v.custo);
    csv += `${v.pedido},${v.data},${v.hora},${valor},${custo},${valor-custo}\n`;
  });

  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "registros.csv";
  a.click();
}

function exportarPDF(){
  const hoje = new Date();
  const mes = hoje.getMonth();
  const ano = hoje.getFullYear();

  const registrosMes = dadosGlobais.filter(r=>{
  const { mes: m, ano: a } = extrairDataBR(r.data);
  return m - 1 === mes && a === ano;
});


  let faturamento = 0;
  let lucro = 0;

  const tbody = document.getElementById("pdfTabela");
  tbody.innerHTML = "";

  registrosMes.forEach(r=>{
    const valor = Number(r.total) || 0;
    const custo = Number(r.custo) || 0;
    const lucroPedido = valor - custo;

    faturamento += valor;
    lucro += lucroPedido;

    tbody.innerHTML += `
      <tr>
        <td>${r.pedido}</td>
        <td>${r.data}</td>
        <td>${valor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
        <td>${lucroPedido.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
      </tr>
    `;
  });

  document.getElementById("infoMes").innerText =
    hoje.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

  document.getElementById("pdfPedidos").innerText = registrosMes.length;
  document.getElementById("pdfFaturamento").innerText =
    faturamento.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("pdfLucro").innerText =
    lucro.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

  document.getElementById("relatorioPDF").style.display = "block";
  window.print();
  document.getElementById("relatorioPDF").style.display = "none";
}

carregarDashboard();
setInterval(carregarDashboard,5000);
</script>

<div id="relatorioPDF" style="display:none; padding:30px; font-family:Arial">
  <h1>Relatório Mensal</h1>
  <p id="infoMes"></p>

  <div style="margin:20px 0">
    <p><strong>Total de pedidos:</strong> <span id="pdfPedidos"></span></p>
    <p><strong>Faturamento:</strong> <span id="pdfFaturamento"></span></p>
    <p><strong>Lucro:</strong> <span id="pdfLucro"></span></p>
  </div>

  <table border="1" width="100%" cellspacing="0" cellpadding="6">
    <thead>
      <tr>
        <th>Pedido</th>
        <th>Data</th>
        <th>Valor</th>
        <th>Lucro</th>
      </tr>
    </thead>
    <tbody id="pdfTabela"></tbody>
  </table>
</div>


</body>
</html>
